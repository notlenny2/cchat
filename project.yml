name: cChat
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  # A real terminal (colors, full-screen programs) for the slide-up terminal drawer.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.9.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
targets:
  # cChat for Mac. (An optional personal build can live beside it in personal.yml, not part of this repo.)
  cChat:
    type: application
    platform: macOS
    sources:
      - Shared
      - cMessage/Sources
      - cMessage/Resources
    dependencies:
      - package: SwiftTerm
      # Videos in chats: SwiftUI's VideoPlayer needs AVKit linked by name, or the app crashes the moment one plays.
      - sdk: AVKit.framework
    info:
      path: cMessage/Info-Public.plist
      properties:
        CFBundleDisplayName: cChat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.notlenny2.cchat
        PRODUCT_NAME: cChat
        # The app launches the local `claude` CLI, so it cannot run inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # cChat for iPhone and iPad: a remote screen for cChat on your Mac (same Wi-Fi). Orange clay, like the Mac app.
  cChatMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Shared
      - Mobile/Sources
      - Mobile/Resources
    dependencies:
      # VideoPlayer crashes the app unless AVKit is linked by name (same as the Mac).
      - sdk: AVKit.framework
    info:
      path: Mobile/Info-Public.plist
      properties:
        CFBundleDisplayName: cChat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "Scan the code on your Mac to link cChat."
        NSLocalNetworkUsageDescription: "cChat talks to your Mac on your Wi-Fi, where your agents run."
        NSBonjourServices: ["_cmessage._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: io.github.notlenny2.cchat.pair
            CFBundleURLSchemes: [cmessage]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.notlenny2.cchat.mobile
        PRODUCT_NAME: cChat
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
