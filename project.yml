name: cChat
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # cChat for Mac. Built into Release-public so it never collides with a personal build (see personal.yml,
  # which is optional and not part of this repo).
  cChat:
    type: application
    platform: macOS
    sources:
      - Shared
      - cMessage/Sources
      - cMessage/Resources
    info:
      path: cMessage/Info-Public.plist
      properties:
        CFBundleDisplayName: cChat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.notlenny2.cchat
        PRODUCT_NAME: cChat
        CONFIGURATION_BUILD_DIR: "$(BUILD_DIR)/$(CONFIGURATION)-public"
        # The app launches the local `claude` CLI, so it cannot run inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
