name: cChat
options:
  deploymentTarget:
    macOS: "14.0"
packages:
  # A real terminal (colors, full-screen programs) for the slide-up terminal drawer.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.9.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "3"
targets:
  # cChat for Mac. (An optional personal build can live beside it in personal.yml, not part of this repo.)
  cChat:
    type: application
    platform: macOS
    sources:
      - Shared
      - cMessage/Sources
      - cMessage/Resources
    dependencies:
      - package: SwiftTerm
    info:
      path: cMessage/Info-Public.plist
      properties:
        CFBundleDisplayName: cChat
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.notlenny2.cchat
        PRODUCT_NAME: cChat
        # The app launches the local `claude` CLI, so it cannot run inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
